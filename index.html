<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunline Garage Doors | Brochure</title>

  <!-- Swiper (free CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

  <style>
    :root { --maxw: 900px; }

    /* ✅ Make the page a stable fullscreen layout */
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0b0c;
      color: #fff;
    }

    /* ✅ This is your main container (you used .viewer in HTML) */
    .viewer {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 12px;

      /* ✅ key: full-height + flex */
      min-height: 100dvh; /* better than 100vh on mobile */
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }

    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 6px 6px;
    }

    .brand { font-weight: 700; font-size: 14px; opacity: .95; }
    .counter { font-size: 13px; opacity: .8; }

    /* ✅ Swiper now flexes to fill remaining space automatically */
    .swiper {
      width: 100%;
      flex: 1;                 /* fills remaining height */
      min-height: 0;           /* IMPORTANT: prevents overflow in flex layouts */
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .swiper-slide {
      display:flex;
      align-items:center;
      justify-content:center;
      background: #111;
    }

    /* ✅ Fit-to-screen behavior */
    .page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;     /* shows whole page */
      user-select: none;
      -webkit-user-drag: none;
      background: #111;
    }

    .controls {
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
      padding: 0 6px;
    }

    .btn {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn:active { transform: translateY(1px); }

    .btn.primary {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.12);
    }

    .hint {
      font-size: 12px;
      opacity: .7;
      padding: 0 6px 6px 6px;
    }

    @media (max-width: 520px) {
      .viewer { padding: 10px; }
      .swiper { border-radius: 16px; }
      .btn { padding: 11px 12px; }
    }
  </style>
</head>

<body>
  <div class="viewer">
    <header>
      <div class="brand">Sunline Garage Doors • Brochure</div>
      <div class="counter" id="counter">Page 1 of 16</div>
    </header>

    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img class="page-img" src="1.png"  alt="Page 1"></div>
        <div class="swiper-slide"><img class="page-img" src="2.png"  alt="Page 2"></div>
        <div class="swiper-slide"><img class="page-img" src="3.png"  alt="Page 3"></div>
        <div class="swiper-slide"><img class="page-img" src="4.png"  alt="Page 4"></div>
        <div class="swiper-slide"><img class="page-img" src="5.png"  alt="Page 5"></div>
        <div class="swiper-slide"><img class="page-img" src="6.png"  alt="Page 6"></div>
        <div class="swiper-slide"><img class="page-img" src="7.png"  alt="Page 7"></div>
        <div class="swiper-slide"><img class="page-img" src="8.png"  alt="Page 8"></div>
        <div class="swiper-slide"><img class="page-img" src="9.png"  alt="Page 9"></div>
        <div class="swiper-slide"><img class="page-img" src="10.png" alt="Page 10"></div>
        <div class="swiper-slide"><img class="page-img" src="11.png" alt="Page 11"></div>
        <div class="swiper-slide"><img class="page-img" src="12.png" alt="Page 12"></div>
        <div class="swiper-slide"><img class="page-img" src="13.png" alt="Page 13"></div>
        <div class="swiper-slide"><img class="page-img" src="14.png" alt="Page 14"></div>
        <div class="swiper-slide"><img class="page-img" src="15.png" alt="Page 15"></div>
        <div class="swiper-slide"><img class="page-img" src="16.png" alt="Page 16"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prev">← Prev</button>
      <a class="btn primary" href="tel:+19497917820">Call Now</a>
      <button class="btn" id="next">Next →</button>
    </div>

    <div class="hint">Tip: swipe left/right on mobile. Pinch-zoom works in most browsers.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const TOTAL = 16;

    const swiper = new Swiper('.swiper', {
      speed: 250,
      spaceBetween: 10,
      slidesPerView: 1,
      centeredSlides: true
    });

    const counter = document.getElementById('counter');
    function updateCounter() {
      counter.textContent = `Page ${swiper.realIndex + 1} of ${TOTAL}`;
    }
    swiper.on('slideChange', updateCounter);
    updateCounter();

    document.getElementById('prev').onclick = () => swiper.slidePrev();
    document.getElementById('next').onclick = () => swiper.slideNext();
  </script>
</body>
</html>
